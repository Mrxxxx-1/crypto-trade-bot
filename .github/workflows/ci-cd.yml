name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q src

      - name: Import smoke test
        run: |
          python -c "from src.config import load_settings; load_settings()"
          python -c "from src import agent_tools, backtest, bot, briefing, config, control, direction, exchange, hedge, hedge_broker, indicators, log_hygiene, models, risk, strategy_trend, subaccount, telegram_control"

      - name: Unit tests
        run: python -m unittest discover -s tests -t . -v

  deploy:
    name: Deploy to GCP
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.GCP_SSH_PRIVATE_KEY }}

      - name: Add VM to known_hosts
        env:
          GCP_SSH_HOST: ${{ secrets.GCP_SSH_HOST }}
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "$GCP_SSH_HOST" >> ~/.ssh/known_hosts

      - name: Run remote update
        env:
          GCP_SSH_HOST: ${{ secrets.GCP_SSH_HOST }}
          GCP_SSH_USER: ${{ secrets.GCP_SSH_USER }}
          GCP_DEPLOY_PATH: ${{ secrets.GCP_DEPLOY_PATH }}
        run: |
          DEPLOY_PATH="${GCP_DEPLOY_PATH:-~/crypto-trade-bot}"
          ssh "${GCP_SSH_USER}@${GCP_SSH_HOST}" "bash -s -- '${DEPLOY_PATH}'" < scripts/remote-update.sh
